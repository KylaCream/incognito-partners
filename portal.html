<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Staff Portal | Incognito Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0b0e;--c:#16161a;--c2:#1f1f25;--ln:rgba(255,255,255,.09);--ln2:rgba(255,255,255,.16);--t:#f2f2ef;--m:#9b9ba4;--a:#D3AF37;--a2:rgba(211,175,55,.14);--g:#35d07f;--r:#ff6b6b;--f:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--t);font:14.5px/1.55 var(--f);min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:560px;height:560px;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
body::before{background:radial-gradient(circle,rgba(211,175,55,.16),transparent 70%);top:-220px;right:-160px}
body::after{background:radial-gradient(circle,rgba(120,120,140,.14),transparent 70%);bottom:-260px;left:-200px}
.w{position:relative;z-index:1;width:min(1120px,100% - 28px);margin:0 auto;padding:16px 0 70px}
svg.i{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;margin-bottom:22px;background:rgba(22,22,26,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:18px}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:34px;filter:brightness(0) invert(1)}
.brand b{display:block;letter-spacing:.2em;font-size:.78rem;font-weight:700;line-height:1.2}.brand small{color:var(--a);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.sp{margin-left:auto}.who{display:flex;align-items:center;gap:10px}.who div{line-height:1.25;text-align:right}.who b{font-size:.88rem;display:block}.who div span{color:var(--m);font-size:.74rem;text-transform:capitalize}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;color:#0a0a0a;background:linear-gradient(135deg,#ecd27a,var(--a) 55%,#9a7b1c);flex:none}
.hello{margin:4px 2px 20px}.hello h1{font-size:1.65rem;font-weight:700;letter-spacing:-.01em}.hello h1 em{font-style:normal;color:var(--a)}.hello p{color:var(--m);font-size:.9rem}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.62em 1.1em;border-radius:12px;border:1px solid var(--ln2);background:var(--c2);cursor:pointer;transition:.18s;font-weight:500}
.btn:hover{border-color:var(--a);transform:translateY(-1px)}.btn:active{transform:none}
.p{background:linear-gradient(135deg,#e6c85c,var(--a));color:#0a0a0a;border-color:transparent;font-weight:600;box-shadow:0 8px 22px rgba(211,175,55,.25)}.p:hover{box-shadow:0 10px 28px rgba(211,175,55,.4);border-color:transparent}
.d{color:var(--r);border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.07)}.d:hover{border-color:var(--r)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)) ,var(--c);border:1px solid var(--ln);border-radius:20px;padding:22px;transition:border-color .2s,transform .2s}
.card h3{font-size:1rem;font-weight:600}
a.card:hover,.grid>.card:hover{border-color:var(--ln2)}
input,select,textarea{width:100%;padding:.72em .95em;border-radius:12px;border:1px solid var(--ln);background:var(--c2);outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--a2)}
label.m{display:grid;gap:5px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.login{width:min(420px,100% - 28px);margin:9vh auto 0;display:grid;gap:14px;padding:34px 30px;text-align:center;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login img{height:64px;margin:0 auto;filter:brightness(0) invert(1)}.login h2{font-size:1.35rem}.login .m{margin-top:-8px}.login input{text-align:left}
.err{color:var(--r);font-size:.86rem;min-height:1.2em}
.big{font-size:2.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em}
.m{color:var(--m);font-size:.84rem}
.stat{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.stat .ic{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--a2);color:var(--a);font-size:1.15rem}
.stat.on{border-color:rgba(53,208,127,.4);background:linear-gradient(180deg,rgba(53,208,127,.1),rgba(53,208,127,0)),var(--c)}
.stat.on .big{color:var(--g)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#55555c;margin-right:7px}.on .dot,.dot.on{background:var(--g);box-shadow:0 0 0 0 rgba(53,208,127,.6);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 8px rgba(53,208,127,0)}100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding:5px;background:var(--c);border:1px solid var(--ln);border-radius:16px;width:fit-content;max-width:100%}
.tabs .btn{border:0;background:none;color:var(--m);padding:.55em 1.05em;border-radius:11px;box-shadow:none}.tabs .btn:hover{color:var(--t);transform:none}
.tabs .btn[aria-selected=true]{background:linear-gradient(135deg,#e6c85c,var(--a));color:#0a0a0a;font-weight:600}
h3.sec{margin:28px 0 12px;font-size:1.02rem;font-weight:600;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{padding:.8em .9em;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
th{color:var(--m);font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}tr:last-child td{border-bottom:0}tbody tr:hover td,table tr:not(:first-child):hover td{background:rgba(255,255,255,.025)}
.card.sc{padding:8px 12px}.sc{overflow-x:auto}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.row>*{flex:1 1 150px}.row .btn{flex:0 0 auto}
.tag{display:inline-block;padding:.15em .75em;border-radius:99px;font-size:.72rem;font-weight:600;background:var(--c2);border:1px solid var(--ln)}
.ok{color:var(--g)}.wait{color:var(--a)}span.ok:not(.tag),span.wait:not(.tag){font-weight:600}
.tag.ok{background:rgba(53,208,127,.1);border-color:rgba(53,208,127,.3)}.tag.wait{background:var(--a2);border-color:rgba(211,175,55,.35)}
.person{display:flex;align-items:center;gap:12px;margin-bottom:12px}.person .av{width:44px;height:44px}.person b{display:block;line-height:1.25}.person .m{word-break:break-all}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:.28em .8em;border-radius:99px;background:var(--c2);color:var(--m);border:1px solid var(--ln)}
.on .pill{background:rgba(53,208,127,.12);color:var(--g);border-color:rgba(53,208,127,.3)}
.chat{display:grid;grid-template-columns:300px 1fr;gap:16px}.cl{display:grid;gap:10px;align-content:start}
.ci{padding:13px 14px;border-radius:16px;border:1px solid var(--ln);background:var(--c);cursor:pointer;text-align:left;transition:.15s}.ci:hover{border-color:var(--ln2)}.ci.on{border-color:var(--a);background:var(--a2)}
.ms{height:400px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:4px 2px}.mg{max-width:80%;padding:.6em 1em;border-radius:16px 16px 16px 4px;background:var(--c2);border:1px solid var(--ln);white-space:pre-wrap;overflow-wrap:anywhere}
.mg.admin{align-self:flex-end;background:linear-gradient(135deg,#e6c85c,var(--a));color:#0a0a0a;border-color:transparent;border-radius:16px 16px 4px 16px}.mg.bot{opacity:.65;font-style:italic}
.empty{display:grid;place-items:center;gap:6px;text-align:center;padding:34px 10px;color:var(--m)}.empty .i{width:2em;height:2em;color:var(--a);opacity:.8}
@media(max-width:760px){.chat{grid-template-columns:1fr}.who div{display:none}.big{font-size:2.1rem}.tabs{width:100%;overflow-x:auto;flex-wrap:nowrap}.tabs .btn{white-space:nowrap}}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.idc{text-align:center}.idp{aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--c2);display:grid;place-items:center;font-size:3rem;font-weight:700;color:var(--a);margin-bottom:14px;border:1px solid var(--ln)}.idp img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.kv b{font-weight:600;display:block;word-break:break-word}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:start center;z-index:50;padding:20px 14px;overflow:auto}.mo .card{width:min(680px,100%)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{display:flex;gap:6px;align-items:center;padding:.4em .8em;border:1px solid var(--ln);border-radius:99px;cursor:pointer;font-size:.8rem}.days input{width:auto}
td.today,th.today{background:var(--a2)}.mini{font-size:.74rem;color:var(--m);white-space:normal}
.rec{display:grid;gap:6px}.rec p{white-space:pre-wrap}.rec .m b{color:var(--t)}
@media(max-width:760px){#pg{grid-template-columns:1fr!important}}

.lg{position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg);overflow:auto}
.lgl{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:40px;text-align:center;background:radial-gradient(circle at 30% 20%,rgba(211,175,55,.2),transparent 55%),linear-gradient(160deg,#17171c,#0b0b0e);border-right:1px solid var(--ln);overflow:hidden}
.lgl::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle,#000,transparent 72%);mask-image:radial-gradient(circle,#000,transparent 72%)}
.lgl>*{position:relative}.lgo{height:46px;filter:brightness(0) invert(1)}.dialw{width:min(340px,72%)}.lgl h2{font-size:1.7rem;line-height:1.2;max-width:16ch}.lgl p{color:var(--m);max-width:34ch}
.lgr{display:grid;place-items:center;padding:32px}.lgf{width:min(390px,100%);display:grid;gap:16px}.lgf h1{font-size:1.9rem;letter-spacing:-.01em}
.pw{position:relative}.pw input{padding-right:4.6em}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--m);cursor:pointer;padding:6px 10px;font-size:.8rem}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px 28px;margin-bottom:22px;border-radius:22px;border:1px solid var(--ln2);background:radial-gradient(circle at 100% 0,rgba(211,175,55,.22),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.04),transparent),var(--c)}
.hero h1{font-size:1.8rem;font-weight:700;letter-spacing:-.01em;margin:2px 0}.hero h1 em{font-style:normal;color:var(--a)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hclk{text-align:right}.hclk b{display:block;font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--a);line-height:1.1}
.bd{margin-left:6px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--r);color:#fff;font-size:.7rem;font-weight:700;line-height:20px;text-align:center}
.tag.no{color:var(--r);background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.3)}
.card.stat{border-top:2px solid rgba(211,175,55,.55)}.card.stat.on{border-top-color:var(--g)}
@media(max-width:860px){.lg{grid-template-columns:1fr}.lgl{padding:22px 20px;border:0;border-bottom:1px solid var(--ln)}.dialw{width:150px}.lgl h2,.lgl p{display:none}.hclk{text-align:left}}

.dd{position:relative}.dm{display:none;position:absolute;top:100%;left:0;z-index:20;min-width:220px;padding:6px;background:var(--c);border:1px solid var(--ln2);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.5);flex-direction:column;gap:2px}
.dd:hover .dm,.dd.open .dm{display:flex}.tabs .dm .btn{justify-content:flex-start;width:100%;white-space:nowrap}.tabs .dm .btn.sel{color:var(--a)}.tabs .dm .btn:hover{background:var(--c2);color:var(--t)}
.pb{height:8px;border-radius:99px;background:var(--c2);overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9a7b1c,var(--a))}
@media(max-width:760px){.tabs{overflow:visible;flex-wrap:wrap}}

/* ===== motion + dashboard upgrade ===== */
.lgl>canvas.fxc{position:absolute!important;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.lgl>*:not(canvas){z-index:1}
.fxs{position:absolute;border:1.5px solid rgba(211,175,55,.45);pointer-events:none;animation:fxf 12s ease-in-out infinite;z-index:0}
.fxs0{border-radius:50%;background:radial-gradient(circle,rgba(211,175,55,.18),transparent 70%)}.fxs1{border-radius:6px;transform:rotate(20deg)}.fxs2{clip-path:polygon(50% 0,100% 100%,0 100%);border:0;background:rgba(211,175,55,.22)}
@keyframes fxf{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-34px) rotate(160deg)}}
.lgf>*{animation:up .7s cubic-bezier(.2,.8,.2,1) backwards}.lgf>*:nth-child(2){animation-delay:.1s}.lgf>*:nth-child(3){animation-delay:.2s}.lgf>*:nth-child(4){animation-delay:.3s}.lgf>*:nth-child(5){animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
#go{position:relative;overflow:hidden}#go::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shn 3.2s infinite}
@keyframes shn{to{left:140%}}
.lgo{animation:glow 3.5s ease-in-out infinite}@keyframes glow{50%{filter:brightness(0) invert(1) drop-shadow(0 0 12px rgba(211,175,55,.8))}}
.clk{cursor:pointer}tr.clk:hover td{background:var(--a2)}
.ch3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-bottom:18px}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.donut svg{width:140px;height:140px;flex:none}
.arc{animation:arc 1.1s cubic-bezier(.2,.8,.2,1) backwards;transition:stroke-width .2s}.arc:hover{stroke-width:20}@keyframes arc{from{stroke-dasharray:0 400}}
.lgd{display:grid;gap:6px;font-size:.82rem}.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.hb{display:grid;grid-template-columns:minmax(70px,110px) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:.82rem}.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;border-radius:9px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#8a6c12,var(--a));animation:gw 1s cubic-bezier(.2,.8,.2,1) backwards}@keyframes gw{from{width:0}}
.hb.clk:hover .bar i{filter:brightness(1.3)}
.dtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.dtools input,.dtools select{max-width:260px}
.dbars{display:flex;align-items:flex-end;gap:10px;height:120px;margin:14px 0 4px}.dbars div{flex:1;display:grid;justify-items:center;align-items:end;height:100%;font-size:.7rem;color:var(--m)}.dbars i{display:block;width:100%;min-height:3px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,var(--a),#8a6c12);transform-origin:bottom;animation:gh .9s cubic-bezier(.2,.8,.2,1) backwards}@keyframes gh{from{transform:scaleY(0)}}
.spk{width:100%;height:60px}.spk path{stroke-dasharray:600;animation:dr 1.4s ease-out forwards}@keyframes dr{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
.mo .card{animation:up .35s ease backwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hubg{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}details>summary{cursor:pointer;padding:5px 0}
@media(max-width:860px){.hubg{grid-template-columns:1fr}}

.shl{display:grid;grid-template-columns:var(--sw,268px) minmax(0,1fr);min-height:100vh;position:relative;z-index:1;transition:grid-template-columns .2s}
.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px 14px;background:linear-gradient(180deg,rgba(211,175,55,.09),transparent 240px),rgba(17,17,21,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--ln);z-index:6}
.sb-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}.sb-brand img{height:40px;filter:brightness(0) invert(1);flex:none}.sb-brand b{display:block;letter-spacing:.18em;font-size:.74rem;line-height:1.2}.sb-brand small{color:var(--a);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.sb nav{flex:1;overflow-y:auto;overflow-x:hidden;display:grid;gap:2px;align-content:start;padding:0 2px 10px;scrollbar-width:thin}
.sb-l{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--m);padding:16px 12px 6px;font-weight:600}
.sbi{display:flex;align-items:center;gap:12px;width:100%;padding:.64em .85em;border:0;border-radius:12px;background:none;color:var(--m);cursor:pointer;text-align:left;font-weight:500;position:relative;transition:.15s;white-space:nowrap}
.sbi:hover{background:rgba(255,255,255,.055);color:var(--t)}.sbi svg.i{font-size:1.2em}
.sbi.on{background:linear-gradient(90deg,rgba(211,175,55,.2),rgba(211,175,55,.02));color:var(--a);font-weight:600}.sbi.on::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--a);box-shadow:0 0 14px var(--a)}
.sbi .bd{margin-left:auto}.sbgh .car{margin-left:auto;transition:.2s}.sbgh .bd+.car{margin-left:6px}.sbg.open .car{transform:rotate(180deg)}
.sbs{display:none;margin:2px 0 4px 20px;padding-left:10px;border-left:1px solid var(--ln);gap:2px}.sbg.open .sbs{display:grid}.sbs .sbi{padding:.5em .75em;font-size:.88rem}
.sb-foot{border-top:1px solid var(--ln);padding-top:14px;display:grid;gap:12px}.sb-user{display:flex;align-items:center;gap:10px;min-width:0}.sb-user b{display:block;font-size:.88rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.sb-act{display:flex;gap:6px;flex-wrap:nowrap}.sb-act .btn{flex:1 1 auto;min-width:0;gap:.4em;padding:.5em .6em;font-size:.82rem;white-space:nowrap}.sb-act .btn .sb-t{white-space:nowrap}.sb-act .sb-col{flex:0 0 auto;padding:.5em .7em}
.mn{min-width:0;padding:0 30px 70px}.tb{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:18px 0 14px;margin-bottom:6px;background:linear-gradient(var(--bg) 72%,transparent)}
.tb h1{font-size:1.4rem;font-weight:700;letter-spacing:-.01em;line-height:1.2}.tbr{display:flex;gap:8px;align-items:center}.burger{display:none;padding:.5em .8em}.scrim{display:none}
.shl.col{--sw:80px}.shl.col .sb-t,.shl.col .sb-l,.shl.col .car,.shl.col .bd,.shl.col .sbs,.shl.col .sbg.open .sbs{display:none}.shl.col .sbi{justify-content:center;padding:.8em 0}.shl.col .sbi.on::before{left:-14px}.shl.col .sb-brand,.shl.col .sb-user{justify-content:center;padding-left:0;padding-right:0}.shl.col .sb-act{flex-direction:column}

/* ================= GLASS UI LAYER (responsive) ================= */
:root{--gl:rgba(255,255,255,.055);--gl2:rgba(255,255,255,.09);--glb:rgba(255,255,255,.13);--glh:rgba(255,255,255,.22);--gsh:0 10px 40px -12px rgba(0,0,0,.6);--gbl:blur(18px) saturate(150%)}
[data-theme="light"]{--gl:rgba(255,255,255,.58);--gl2:rgba(255,255,255,.78);--glb:rgba(255,255,255,.9);--glh:#fff;--gsh:0 10px 34px -14px rgba(60,50,20,.22)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:radial-gradient(900px 600px at 8% -8%,rgba(211,175,55,.17),transparent 60%),radial-gradient(800px 600px at 105% 18%,rgba(90,110,255,.13),transparent 60%),radial-gradient(900px 700px at 40% 112%,rgba(47,197,138,.10),transparent 60%),var(--bg);background-attachment:fixed}
[data-theme="light"] body{background:radial-gradient(900px 600px at 8% -8%,rgba(211,175,55,.25),transparent 60%),radial-gradient(800px 600px at 105% 18%,rgba(90,110,255,.15),transparent 60%),radial-gradient(900px 700px at 40% 112%,rgba(47,197,138,.15),transparent 60%),var(--bg)}
img,svg,video,canvas{max-width:100%}
/* glass surfaces */
.card,.top,.tb .tbr,.tabs,.pill,.cmdk>*,.toast,.toasts>*{-webkit-backdrop-filter:var(--gbl);backdrop-filter:var(--gbl)}
.card{background:linear-gradient(145deg,var(--gl2),var(--gl) 55%),transparent;border:1px solid var(--glb);border-top-color:var(--glh);border-radius:22px;box-shadow:var(--gsh),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .25s,border-color .25s,box-shadow .25s,background .25s}
@media(hover:hover){.grid>.card:hover,a.card:hover,.lvc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--a) 45%,var(--glb));box-shadow:0 18px 44px -14px rgba(0,0,0,.55),0 0 0 1px color-mix(in srgb,var(--a) 18%,transparent)}}
.stat.on{background:linear-gradient(145deg,rgba(53,208,127,.16),var(--gl) 60%)}
.stat .ic{border-radius:14px;background:linear-gradient(135deg,var(--a2),transparent);border:1px solid var(--glb)}
/* sidebar + topbars */
.sb{background:linear-gradient(180deg,rgba(211,175,55,.12),transparent 260px),var(--gl);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-right:1px solid var(--glb);box-shadow:8px 0 40px -20px rgba(0,0,0,.6)}
[data-theme="light"] .sb{background:linear-gradient(180deg,rgba(211,175,55,.14),transparent 260px),rgba(255,255,255,.6)}
.sbi{border-radius:14px}.sbi:hover{background:var(--gl2)}
.sbi.on{background:linear-gradient(90deg,rgba(211,175,55,.26),rgba(211,175,55,.04));box-shadow:inset 0 0 0 1px rgba(211,175,55,.25)}
.top{background:var(--gl);border:1px solid var(--glb);box-shadow:var(--gsh)}
.tb{background:linear-gradient(color-mix(in srgb,var(--bg) 70%,transparent) 55%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* controls */
.btn{background:var(--gl2);border:1px solid var(--glb);border-top-color:var(--glh);border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);min-height:40px}
.btn.p,.p{background:linear-gradient(135deg,#f0d572,var(--a) 60%,#b8922a);color:#1a1405;border-color:rgba(255,255,255,.25);box-shadow:0 10px 26px -8px rgba(211,175,55,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.btn:active{transform:scale(.97)}
input,select,textarea{background:var(--gl);border:1px solid var(--glb);border-radius:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
input:focus,select:focus,textarea:focus{background:var(--gl2);border-color:var(--a);box-shadow:0 0 0 4px var(--a2)}
.pill{background:var(--gl2);border-color:var(--glb)}
.tabs{background:var(--gl);border:1px solid var(--glb);border-radius:16px;padding:4px}
/* tables */
table th{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--m);font-weight:600;background:var(--gl)}
table tbody tr:hover td,table tr:hover>td{background:var(--gl)}
/* modals */
.mo{background:rgba(6,6,10,.5);-webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);padding:clamp(10px,3vw,24px)}
.mo .card{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.05)),rgba(24,24,30,.55);box-shadow:0 30px 80px -20px rgba(0,0,0,.8);animation:glin .28s ease-out}
[data-theme="light"] .mo .card{background:rgba(255,255,255,.82)}
@keyframes glin{from{opacity:0;transform:translateY(14px) scale(.98)}}
/* login */
.lg{background:var(--gl);border:1px solid var(--glb);border-radius:28px;box-shadow:var(--gsh);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);overflow:hidden}
/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:rgba(160,160,170,.35) transparent}
/* responsive */
.mn{padding:0 clamp(14px,3.2vw,34px) 70px}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(min-width:1500px){.w{width:min(1320px,100% - 56px)}}
@media(max-width:900px){.sb{background:rgba(16,16,22,.82);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px)}[data-theme="light"] .sb{background:rgba(255,255,255,.88)}.scrim{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}}
@media(max-width:600px){.card{border-radius:18px;padding:16px}.tb h1{font-size:1.15rem}.mo .card{max-height:calc(100dvh - 24px);overflow:auto}.f2{grid-template-columns:1fr}}
@media(pointer:coarse){.btn,.sbi,.tabs .btn{min-height:44px}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--gl:rgba(30,30,36,.92);--gl2:rgba(38,38,46,.95)}[data-theme="light"]{--gl:rgba(255,255,255,.95);--gl2:#fff}}

const ICO={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18.5 14.8c1.6.7 2.7 2.3 3 5"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',pulse:'<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>',star:'<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.2 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',chat:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',out:'<path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4M16 8l4 4-4 4M20 12H9"/>',id:'<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.4-1.6 1.4-2.3 2.5-2.3s2.1.7 2.5 2.3M14 10h4M14 14h3"/>',file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h6"/>',org:'<rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/>',inbox:'<path d="M3 13l3-8h12l3 8v6a1 1 0 01-1 1H4a1 1 0 01-1-1zM3 13h5l1 3h6l1-3h5"/>'};

ICO.sun='<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>';

const isLight=()=>document.documentElement.dataset.theme==='light';
const themeBtn=(x='')=>`<button class="btn thm ${x}" onclick="toggleTheme()" aria-label="Switch to ${isLight()?'dark':'light'} mode" title="${isLight()?'Dark':'Light'} mode">${ic(isLight()?'moon':'sun')}</button>`;
function toggleTheme(){const n=isLight()?'dark':'light';document.documentElement.dataset.theme=n;try{localStorage.setItem('ipth',n);}catch(e){}document.querySelectorAll('.thm').forEach(b=>{b.outerHTML=themeBtn(b.classList.contains('thm-fx')?'thm-fx':'');});}
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

const shrink=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const w=360,h=450,c=document.createElement('canvas');c.width=w;c.height=h;const k=Math.max(w/im.width,h/im.height),x=(w-im.width*k)/2,y=(h-im.height*k)*.2;c.getContext('2d').drawImage(im,x,y,im.width*k,im.height*k);ok(c.toDataURL('image/jpeg',.82));};im.onerror=()=>no(new Error('Not a valid image'));im.src=URL.createObjectURL(f);});
async function api(p,m='GET',b){
  const r=await fetch('/api'+p+(p.includes('?')?'&':'?')+'tz='+TZ,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));if(r.status===401&&me){signOut(true);}
  if(!r.ok)throw new Error(j.error||(r.status===404?'The server does not know '+p.split('?')[0]+'. An old copy of the server is probably still running. Stop it and start server.js again.':'Request failed ('+r.status+') for '+p.split('?')[0]));return j;

requestAnimationFrame(f);})();}

function dashCharts(d,A){

  const cs=d.campaigns.filter(c=>c.rating!=null).map(c=>`<div class="hb"><span title="${esc(c.name)}">${esc(c.name)}</span><div class="bar"><i style="width:${c.rating/5*100}%"></i></div><b>${c.rating.toFixed(1)}</b></div>`).join('')||'<div class="m">No performance reviews yet.</div>';
  const top=[...A].sort((a,b)=>b.today-a.today).filter(a=>a.today>0).slice(0,6),mx=Math.max(1,...top.map(a=>a.today));

  return `<div class="card"><h3 style="margin-bottom:6px">${ic('pulse')} Attendance right now</h3><div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="Attendance">${arcs}<text x="70" y="68" text-anchor="middle" fill="currentColor" style="font:800 24px Poppins,sans-serif">${n.live}/${A.length}</text><text x="70" y="86" text-anchor="middle" fill="var(--m)" style="font:11px Poppins,sans-serif">on shift</text></svg><div class="lgd">${Object.keys(n).map(k=>`<div><i style="background:${col[k]}"></i>${SL[k][1]}: <b>${n[k]}</b></div>`).join('')}</div></div></div>
  <div class="card"><h3>${ic('star')} Performance by campaign</h3><div class="m">Average review rating out of 5</div>${cs}</div>
  <div class="card"><h3>${ic('clock')} Top hours today</h3><div class="m">Click an agent to open their profile</div>${hs}</div>`;
}

    if(PICK.length>=12)throw new Error('You can attach up to 12 items per post.');
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(/^image\//.test(f.type)||['jpg','jpeg','png','gif','webp'].includes(ext)){if(PICK.filter(p=>p.kind==='img').length>=8)throw new Error('Up to 8 photos per post.');const r=await hubImg(f);PICK.push({kind:'img',...r});}
    else{if(!DOCX.includes(ext))throw new Error('"'+f.name+'" is not a supported file type.');PICK.push({kind:'file',name:f.name,size:f.size,data:await readFile(f,8e6)});}
  }catch(e){if(er)er.textContent=e.message;}}
  renderPick();}

  $('#pane').innerHTML=`<div class="chat"><div class="cl" id="cl"></div><div class="card" id="cv">${empty('chat','Visitors who tap "Talk to a real person" appear here.<br/>Pick a conversation to reply.')}</div></div>`;list();
}
function list(){sock.emit('list',cs=>{const el=$('#cl');if(!el)return;el.innerHTML=cs.map(c=>`<button class="ci ${c.id===cur?'on':''}" onclick="openChat(${c.id})"><div style="display:flex;align-items:center;gap:8px;justify-content:space-between"><b>Visitor ${esc(c.vid.slice(-5))}</b>${c.unread?`<span class="tag wait">${c.unread} new</span>`:''}</div><div class="m">${esc(c.email||'no email yet')}</div><div class="m">${esc((c.lastText||'').slice(0,50))}</div></button>`).join('')||empty('inbox','No live chats yet.');});}
function openChat(id,quiet){cur=id;sock.emit('open',id,ms=>{const v=$('#cv');if(!v)return;const keep=quiet&&$('#ci')?$('#ci').value:'';
  v.innerHTML=`<div class="ms" id="ms">${ms.map(m=>`<div class="mg ${m.who}">${esc(m.text)}</div>`).join('')}</div><div class="row" style="margin:12px 0 0"><input id="ci" placeholder="Type a reply…"/><button class="btn p" id="sd">Send</button><button class="btn" id="en">End chat</button></div>`;
  $('#ci').value=keep;$('#ms').scrollTop=1e9;const send=()=>{const t=$('#ci').value.trim();if(t){sock.emit('reply',{id,text:t});$('#ci').value='';}};
  $('#sd').onclick=send;$('#ci').onkeydown=e=>{if(e.key==='Enter')send()};$('#en').onclick=()=>sock.emit('end',id);if(!quiet)list();});}

  pc.onconnectionstatechange=()=>{if(!C)return;const s=pc.connectionState;if(s==='connected'){C.on=true;clearTimeout(C.nt);const t0=Date.now();clearInterval(C.tm);C.tm=setInterval(()=>{const x=Math.floor((Date.now()-t0)/1000);stat(String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'));},1000);}
    else if(s==='disconnected')stat('Reconnecting…');else if(s==='checking'||s==='connecting')stat('Connecting…');else if(s==='failed'){sk.emit('call:end',{to:C.peer});cleanup();note('The call could not connect. Your network may be blocking calls.');}};
  return pc;}
const flush=async()=>{while(C&&C.q.length)try{await C.pc.addIceCandidate(C.q.shift());}catch(e){}};
async function start(peer,name,video){
  if(C){note('You are already in a call.');return;}
  if(!sk||!navigator.mediaDevices||!window.RTCPeerConnection){note('Calls are not supported in this browser, or the connection is not secure (https).');return;}
  const stream=await media(video);if(!stream)return;
  C={peer,name,video,stream,q:[]};callUI();stat('Calling…');
  sk.emit('call:invite',{to:peer,video},ack=>{if(C&&(!ack||!ack.online)){cleanup();note(name+' is offline right now.');}});
  C.nt=setTimeout(()=>{if(C&&!C.on){sk.emit('call:end',{to:peer});cleanup();note(name+' did not answer.');}},45000);}
function incoming(m){C={peer:m.from,name:m.name,video:m.video,q:[],ringing:1};ring();
  if(document.hidden&&'Notification'in window&&Notification.permission==='granted')try{new Notification(m.name+' is calling',{body:m.video?'Video call':'Voice call'});}catch(e){}
  const b=document.createElement('div');b.id='callin';b.setAttribute('role','alertdialog');b.innerHTML=`<b>${esc(m.name)}</b><div class="m" style="margin:4px 0 12px">Incoming ${m.video?'video':'voice'} call</div><div style="display:flex;gap:12px"><button type="button" class="btn ib fill" id="cacc" aria-label="Accept call" title="Accept call">${IC.ph}</button><button type="button" class="btn ib" id="cdec" aria-label="Decline call" title="Decline call">${IC.off}</button></div>`;document.body.append(b);
  $('#cdec').onclick=()=>{sk.emit('call:decline',{to:m.from});cleanup();};
  $('#cacc').onclick=async()=>{stopRing();const stream=await media(m.video);if(!stream){sk.emit('call:decline',{to:m.from});cleanup();return;}if(!C)return;C.stream=stream;C.ringing=0;b.remove();callUI();stat('Connecting…');await mkpc();sk.emit('call:accept',{to:m.from,video:m.video});};}
window.callBind=s=>{sk=s;try{window.coachBind&&coachBind(s);}catch(e){}
  s.on('call:incoming',m=>{if(C)return s.emit('call:decline',{to:m.from,reason:'busy'});incoming(m);});
  s.on('call:accept',async m=>{if(!C||C.peer!==m.from||C.pc)return;const pc=await mkpc(),o=await pc.createOffer();await pc.setLocalDescription(o);s.emit('call:offer',{to:C.peer,data:o});});
  s.on('call:offer',async m=>{if(!C||C.peer!==m.from||!C.pc)return;await C.pc.setRemoteDescription(m.data);await flush();const a=await C.pc.createAnswer();await C.pc.setLocalDescription(a);s.emit('call:answer',{to:C.peer,data:a});});
  s.on('call:answer',async m=>{if(!C||C.peer!==m.from||!C.pc)return;await C.pc.setRemoteDescription(m.data);await flush();});
  s.on('call:ice',async m=>{if(!C||C.peer!==m.from)return;if(C.pc&&C.pc.remoteDescription){try{await C.pc.addIceCandidate(m.data);}catch(e){}}else C.q.push(m.data);});
  s.on('call:decline',m=>{if(C&&C.peer===m.from){const n=C.name;cleanup();note(m.reason==='busy'?n+' is on another call.':n+' declined the call.');}});
  s.on('call:end',m=>{if(C&&C.peer===m.from){const n=C.name,missed=C.ringing;cleanup();note(missed?'Missed call from '+n+'.':'The call ended.');}});};
window.callBar=room=>{const b=$('#mcall');if(!b)return;const m=String(room).match(/^dm:(\d+):(\d+)$/);if(!m){b.hidden=true;return;}const o=+m[1]===me.id?+m[2]:+m[1],p=(window.MS.people||[]).find(x=>x.id===o),n=p?p.name:'Coworker';b.hidden=false;$('#mcv').onclick=()=>start(o,n,false);$('#mcvid').onclick=()=>start(o,n,true);};
})();
</script>
